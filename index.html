<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة الأنظمة والبرامج</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=6">
<link rel="manifest" href="./manifest.webmanifest?v=6">
<meta name="theme-color" content="#087f7b">
<meta name="apple-mobile-web-app-title" content="بوابة الأنظمة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#f3f7f7}
  body{font-family:Tahoma,Arial,sans-serif}
  #portal{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  #fallback{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;max-width:calc(100vw - 24px);display:none;gap:8px;align-items:center;justify-content:center;padding:10px 13px;background:#fff;box-shadow:0 2px 12px #0002;border-radius:12px;color:#183b40;font-size:13px}
  #fallback a{color:#075958;font-weight:700}
</style>
</head>
<body>
<iframe id="portal"
 src="https://script.google.com/macros/s/AKfycbzEBwgGd5GROgHou-Zb83fOLie76VlSlmkeW8XxZ5b8IkhBwbZa_J7p0dl-lmEFaA3K/exec"
 title="بوابة الأنظمة والبرامج"
 loading="eager"
 referrerpolicy="strict-origin-when-cross-origin"
 allow="clipboard-read; clipboard-write"
></iframe>
<div id="fallback">
  إذا لم تظهر البوابة،
  <a href="https://script.google.com/macros/s/AKfycbzEBwgGd5GROgHou-Zb83fOLie76VlSlmkeW8XxZ5b8IkhBwbZa_J7p0dl-lmEFaA3K/exec" target="_blank" rel="noopener noreferrer">افتحها في المتصفح</a>
</div>
<script>
  // يظهر رابط بديل بعد ثوانٍ؛ ظهور إطار فارغ لا يمكن اكتشافه بدقة عبر النطاقات.
  window.setTimeout(function(){
    document.getElementById('fallback').style.display='flex';
  }, 10000);
</script>
</body>
</html>
