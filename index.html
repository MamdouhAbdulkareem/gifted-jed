<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة الأنظمة والبرامج</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="بوابة الأنظمة">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f8f7;color:#183b40;font-family:Tahoma,Arial,sans-serif;text-align:center;padding:24px}
    main{width:min(100%,420px);background:#fff;border:1px solid #dce9e8;padding:38px 24px;border-radius:22px;box-shadow:0 10px 35px #0a514b12}
    img{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 18px}
    h1{font-size:23px;margin:0 0 12px}
    p{font-size:14px;line-height:1.8;color:#586c6e;margin:0 0 24px}
    a{display:block;padding:15px 12px;background:#087f7b;color:#fff;border-radius:12px;font-weight:bold;text-decoration:none;font-size:17px}
    a:hover{background:#075958}
  </style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="شعار وزارة التعليم">
  <h1>بوابة الأنظمة والبرامج</h1>
  <p>اضغط على الزر لفتح البوابة الرسمية.</p>
  <!-- استبدل رابط المثال برابط نشر Apps Script الذي ينتهي بـ /exec -->
  <a href="https://script.google.com/macros/s/AKfycbzEBwgGd5GROgHou-Zb83fOLie76VlSlmkeW8XxZ5b8IkhBwbZa_J7p0dl-lmEFaA3K/exec" id="portalLink">الدخول إلى البوابة</a>
</main>
</body>
</html>
